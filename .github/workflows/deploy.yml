name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  schedule:
    # Daily at 10:00 UTC (6am Eastern) to pick up new Instagram photos
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - name: Sync Instagram photos
        run: node scripts/sync-instagram.mjs
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_HASHTAG: ${{ vars.INSTAGRAM_HASHTAG }}
          INSTAGRAM_LIMIT: ${{ vars.INSTAGRAM_LIMIT }}
          REFRESHED_TOKEN_FILE: ${{ runner.temp }}/ig-token
      # Instagram tokens expire after 60 days unless refreshed. If a
      # SECRETS_ADMIN_TOKEN secret is set, save the refreshed token back.
      - name: Save refreshed Instagram token
        env:
          GH_TOKEN: ${{ secrets.SECRETS_ADMIN_TOKEN }}
        run: |
          f="${{ runner.temp }}/ig-token"
          if [ -n "$GH_TOKEN" ] && [ -s "$f" ]; then
            echo "::add-mask::$(cat "$f")"
            gh secret set INSTAGRAM_TOKEN --repo "${{ github.repository }}" < "$f"
          fi
          rm -f "$f"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
